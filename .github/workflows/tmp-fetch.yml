name: Fetch public series (temporary)

on:
  push:
    branches: [dispersion-test]
    paths: [".github/workflows/tmp-fetch.yml"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests yfinance
      - run: |
          mkdir -p _tmp_data && cd _tmp_data
          curl -sSL -A "Mozilla/5.0" -o DSPX_History.csv https://cdn-api.cboe.com/api/global/us_indices/daily_prices/DSPX_History.csv || true
          curl -sSL -A "Mozilla/5.0" -o DSPX_History_cdn.csv https://cdn.cboe.com/api/global/us_indices/daily_prices/DSPX_History.csv || true
          python - <<'PY'
          import yfinance as yf, pandas as pd
          d = yf.download(["^GSPC", "^VIX"], start="1990-01-01", auto_adjust=True, progress=False)["Close"]
          d.index = pd.to_datetime(d.index).tz_localize(None)
          d.to_csv("yahoo_gspc_vix.csv")
          print(d.tail(3))
          PY
          wc -c *; head -3 DSPX_History.csv
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _tmp_data
          git commit -m "Temporary: public series for the protocol 6 run"
          git push
